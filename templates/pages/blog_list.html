{{template "layout.html" .}}

{{define "content"}}

<div class="block">
    {{range .Vars.Blogs}}
        <p>
            <a href="{{printf "/blogs/%s" .Slug}}" class="row">
                {{.Title}}

                <span class="italic push-inline-end">{{format_time .PublishedAt "DateOnly"}}</span>
            </a>
        </p>
    {{end}}
</div>

{{end}}
