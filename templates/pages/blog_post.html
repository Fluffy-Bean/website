{{template "layout.html" .}}

{{define "content"}}

{{if .Vars.IsOldBlog}}
    {{template "blocks.notice" props
        "Text" "This is an old blog! Its contents may not render properly and contain inaccurate/out of date information."
    }}
{{end}}

<div class="block markdown blog">
    {{noescape .Vars.BlogHTML}}
</div>

{{end}}
