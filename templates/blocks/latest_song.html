{{define "blocks.latest_song" -}}

<a
    href="https://www.last.fm/user/Fluffy_Bean_"
    target="_blank"
    class="block latest-song"
>
    <img src="/last-fm/thumbnail" alt="{{.Album}} thumbnail" />
    <p>
        <b>Listening to {{.Title}}</b>
        <br>
        On {{.Album}}
        <br>
        By {{.Artist}}
    </p>
</a>

{{end}}
